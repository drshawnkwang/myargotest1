---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: all-apps
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/drshawnkwang/myargotest1.git'
      targetRevision: HEAD
      path: 'argocd-applicationsets'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
